name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      - name: Generate benchmark fixtures
        run: uv run python scripts/make_fixtures.py --output "$RUNNER_TEMP/sloth-valet-fixtures"
      - name: Smoke-test the installer
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/uv-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/uv-bin"
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          ./install.sh
          valet --version
