[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sloth-valet"
version = "0.1.0"
description = "A slow, private file valet powered by a local open-weight model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "typer>=0.12,<1",
]

[project.scripts]
valet = "sloth_valet.cli:main_entrypoint"

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sloth_valet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: requires a running local Ollama and an explicitly named model",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
